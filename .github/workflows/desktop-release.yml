name: Desktop Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'ci/**'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: shiguang-agent-windows
            artifact_globs: |
              release/shiguang-agent-setup-*.exe
              release/win-unpacked/**

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck desktop
        run: npm run desktop:typecheck

      - name: Build desktop bundles
        run: npm run desktop:build

      - name: Package Windows desktop
        if: runner.os == 'Windows'
        run: npx electron-builder build --win --x64 --publish never

      - name: Zip Windows unpacked app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path 'release/win-unpacked/*' -DestinationPath 'release/win-unpacked.zip' -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_globs }}
            release/win-unpacked.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-desktop
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Flatten release files
        shell: bash
        run: |
          mkdir -p release-files
          find release-artifacts -type f \( \
            -name 'shiguang-agent-setup-*.exe' -o \
            -name 'win-unpacked.zip' \
          \) -exec cp {} release-files/ \;
          ls -R release-files

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-files/*.exe
            release-files/*.zip
          generate_release_notes: true

  publish-latest:
    name: Publish Latest Download
    if: github.ref == 'refs/heads/main'
    needs: build-desktop
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Flatten latest files
        shell: bash
        run: |
          mkdir -p release-files
          find release-artifacts -type f \( \
            -name 'shiguang-agent-setup-*.exe' -o \
            -name 'win-unpacked.zip' \
          \) -exec cp {} release-files/ \;
          ls -R release-files

      - name: Replace latest prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete latest --yes --cleanup-tag || true
          git tag -f latest "${GITHUB_SHA}"
          git push -f origin latest
          gh release create latest release-files/* \
            --title "Shiguang Agent latest" \
            --notes "Automatic build from main commit ${GITHUB_SHA}." \
            --prerelease \
            --target "${GITHUB_SHA}"
